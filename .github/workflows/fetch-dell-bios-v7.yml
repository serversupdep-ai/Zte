name: fetch-dell-bios-v7

# Relay v7: CatalogPC.xml is UTF-16 with relative paths — convert, grep, download.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v7.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Convert catalog and harvest
        run: |
          L=relay7_diag.txt
          : > "$L"
          echo "date: $(date -u)" >> "$L"
          mkdir -p cat
          curl -fsSL --retry 2 --max-time 420 -o cat/CatalogPC.cab "https://downloads.dell.com/catalog/CatalogPC.cab" >> "$L" 2>&1 || true
          sudo apt-get install -y -qq cabextract >> "$L" 2>&1 || true
          mkdir -p cat/pc
          (cd cat/pc && cabextract -q ../CatalogPC.cab) >> "$L" 2>&1 || true
          iconv -f UTF-16 -t UTF-8 cat/pc/CatalogPC.xml > cat/catalog.xml || true
          wc -c cat/catalog.xml >> "$L" 2>&1 || true
          echo "=== 3090 exe paths ===" >> "$L"
          grep -oE 'path="FOLDER[0-9]+M/[0-9]+/[^"]*3090[^"]*\.exe"' cat/catalog.xml | tr -d '"' | sed 's/^path=//' | sort -u | tee paths3090.txt >> "$L" 2>&1 || true
          echo "=== all OptiPlex exe paths (sample) ===" >> "$L"
          grep -oE 'path="FOLDER[0-9]+M/[0-9]+/OptiPlex_[^"]*\.exe"' cat/catalog.xml | tr -d '"' | sed 's/^path=//' | sort -u | head -40 >> "$L" 2>&1 || true
          echo "=== count ===" >> "$L"; wc -l paths3090.txt >> "$L" 2>&1 || true
          cat "$L"

      - name: Download newest 3090 BIOS
        run: |
          L=relay7_diag.txt
          REL=$(grep -oE 'FOLDER[0-9]+M/[0-9]+/OptiPlex_3090_[0-9.]+\.exe' paths3090.txt 2>/dev/null | sort -V | tail -1 || true)
          echo "REL=$REL" >> "$L" 2>&1 || true
          echo "REL=$REL" > url_used.txt
          if [ -n "$REL" ]; then
            U="https://downloads.dell.com/$REL"
            echo "U=$U" >> "$L" 2>&1 || true
            curl -fL --retry 4 --retry-delay 3 --max-time 900 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o OptiPlex_3090_latest.exe "$U" >> "$L" 2>&1 || true
            ls -la OptiPlex_3090_latest.exe >> "$L" 2>&1 || true
            sha256sum OptiPlex_3090_latest.exe > LATEST_BIOS.sha256 2>&1 || true
          fi
          cat "$L"

      - name: Always commit
        run: |
          set -e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          rm -rf cat || true
          git add -f relay7_diag.txt paths3090.txt url_used.txt 2>/dev/null || true
          [ -f OptiPlex_3090_latest.exe ] && git add -f OptiPlex_3090_latest.exe LATEST_BIOS.sha256 || true
          git status --short
          git commit -m "relay7: utf8 catalog harvest + 3090 BIOS download [skip ci]" || echo "NOTHING TO COMMIT"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fetch-dell-bios-v7.yml || true
          git commit -m "chore: remove relay v7 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
