name: Fetch Dell firmware

# Automated firmware acquisition for the FC1B unlock agent.
# Runs on a GitHub Actions runner (open internet), downloads the official
# Dell BIOS package for the Precision 3640 Tower, verifies its SHA-256,
# and drops it on a temporary branch. The calling agent fetches the file
# via git and deletes the temp branch right after. Nothing lands on the
# session branch and no artifacts are retained.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-drop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for push credentials)
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a05b-zte
          fetch-depth: 1

      - name: Download Dell BIOS package
        run: |
          mkdir -p /tmp/fw
          curl -fL --retry 3 --retry-delay 5 -o /tmp/fw/Precision_3640_1.37.0.exe \
            "https://dl.dell.com/FOLDER12665143M/1/Precision_3640_1.37.0.exe"
          ls -la /tmp/fw

      - name: Verify SHA-256
        run: |
          echo "e45d3e19b25df9b388a5137788481adbc9710692ff39343302aaa615a5a3958a  /tmp/fw/Precision_3640_1.37.0.exe" | sha256sum -c -

      - name: Drop file on temporary branch
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH="arena/fw-drop-${TIMESTAMP}"
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git rm -rq .github 2>/dev/null || true
          mkdir -p firmware
          mv /tmp/fw/Precision_3640_1.37.0.exe firmware/
          git add firmware/
          git commit -m "temp: Dell Precision 3640 BIOS 1.37.0 (auto-dropped for agent, branch deleted after fetch)"
          git push origin "${BRANCH}"
          echo "DROP_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Report
        run: echo "Firmware dropped on branch ${DROP_BRANCH}"
