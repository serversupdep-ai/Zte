name: fetch-dell-bios-v5

# Relay v5: simple + bulletproof logging. Diagnose network, test known-good URL,
# then attempt CatalogPC.cab download/extract/harvest. Always commits the log.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v5.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Diagnose
        run: |
          L=relay5_diag.txt
          : > "$L"
          echo "date: $(date -u)" >> "$L" 2>&1 || true
          echo "pwd: $(pwd)" >> "$L" 2>&1 || true
          echo "--- dns ---" >> "$L" 2>&1 || true
          for h in dl.dell.com downloads.dell.com www.dell.com www.bing.com api.github.com; do
            echo "getent $h:" >> "$L" 2>&1 || true
            getent hosts "$h" >> "$L" 2>&1 || echo "  FAILED" >> "$L" || true
          done
          echo "--- known-good control (v1 URL) ---" >> "$L" 2>&1 || true
          curl -sIL --max-time 20 "https://dl.dell.com/FOLDER07958771M/2/OptiPlex_3090_2.0.7.exe" 2>&1 | head -12 >> "$L" || true
          echo "--- catalog probes ---" >> "$L" 2>&1 || true
          for u in "https://dl.dell.com/catalog/CatalogPC.cab" "https://downloads.dell.com/catalog/CatalogPC.cab" "https://downloads.dell.com/catalog/OptiPlex_3090.cab"; do
            echo "HEAD $u" >> "$L" 2>&1 || true
            curl -sIL --max-time 30 "$u" 2>&1 | head -8 >> "$L" || true
          done
          cat "$L"

      - name: Download catalog and harvest
        run: |
          L=relay5_diag.txt
          echo "--- download catalog ---" >> "$L" 2>&1 || true
          mkdir -p cat || true
          ok=""
          for u in "https://downloads.dell.com/catalog/CatalogPC.cab" "https://dl.dell.com/catalog/CatalogPC.cab"; do
            echo "GET $u" >> "$L" 2>&1 || true
            if curl -fL --retry 2 --max-time 420 -o cat/CatalogPC.cab "$u" >> "$L" 2>&1; then ok="$u"; break; fi
          done
          echo "ok=$ok" >> "$L" 2>&1 || true
          if [ -n "$ok" ] && [ -s cat/CatalogPC.cab ]; then
            sudo apt-get install -y -qq cabextract >> "$L" 2>&1 || true
            mkdir -p cat/pc || true
            (cd cat/pc && cabextract -q ../CatalogPC.cab) >> "$L" 2>&1 || true
            find cat/pc -type f | head -20 >> "$L" 2>&1 || true
            grep -rhoE 'https?://(downloads|dl)\.dell\.com/[^<" ]*3090[^<" ]*\.exe' cat/pc 2>/dev/null | sort -u > bios_urls.txt || true
            echo "harvested:" >> "$L" 2>&1 || true
            cat bios_urls.txt >> "$L" 2>&1 || true
          fi
          cat "$L"

      - name: Download newest 3090 BIOS
        run: |
          L=relay5_diag.txt
          echo "--- pick url ---" >> "$L" 2>&1 || true
          URL=$(grep -oE 'https?://[^ ]*3090[^ ]*\.exe' bios_urls.txt 2>/dev/null | sort -V | tail -1 || true)
          echo "URL=$URL" >> "$L" 2>&1 || true
          if [ -n "$URL" ]; then
            curl -fL --retry 4 --retry-delay 3 -o OptiPlex_3090_latest.exe "$URL" >> "$L" 2>&1 || true
            ls -la OptiPlex_3090_latest.exe >> "$L" 2>&1 || true
            sha256sum OptiPlex_3090_latest.exe > LATEST_BIOS.sha256 2>&1 || true
          fi
          cat "$L"

      - name: Always commit
        run: |
          set -e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          ls -la
          git add -f relay5_diag.txt || true
          [ -s bios_urls.txt ] && git add -f bios_urls.txt || true
          [ -f OptiPlex_3090_latest.exe ] && git add -f OptiPlex_3090_latest.exe LATEST_BIOS.sha256 || true
          git status --short
          git commit -m "relay5: network diag + catalog harvest [skip ci]" || echo "NOTHING TO COMMIT"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fetch-dell-bios-v5.yml || true
          git commit -m "chore: remove relay v5 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
