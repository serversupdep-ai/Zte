name: Collect forum dumps
on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['relay/forum_catalog.txt', '.github/workflows/collect-forum-dumps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractors
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full p7zip-rar > /dev/null
      - name: Download and extract forum dumps
        run: |
          mkdir -p bios-analysis/forum /tmp/dl
          : > /tmp/status.log
          while IFS='|' read -r url slug desc; do
            case "$url" in \#*|"") continue ;; esac
            url=$(echo "$url" | xargs); slug=$(echo "$slug" | xargs); desc=$(echo "$desc" | xargs)
            [ -d "bios-analysis/forum/$slug" ] && { echo "$slug already collected" >> /tmp/status.log; continue; }
            echo "== $slug : $desc"
            code=$(curl -sL --retry 2 --max-time 600 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -e "https://www.badcaps.net/forum/" -w "%{http_code}" -o "/tmp/dl/$slug.bin" "$url") || code=ERR
            sz=$(stat -c%s "/tmp/dl/$slug.bin" 2>/dev/null || echo 0)
            magic=$(head -c4 "/tmp/dl/$slug.bin" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            echo "$slug http=$code size=$sz magic=$magic" >> /tmp/status.log
            if [ "$code" = "200" ] && [ "$sz" -gt 100000 ] && { [ "${magic:0:6}" = "504b03" ] || [ "${magic:0:8}" = "52617221" ]; }; then
              mkdir -p "bios-analysis/forum/$slug"
              cp "/tmp/dl/$slug.bin" "bios-analysis/forum/$slug/archive_$( [ "${magic:0:6}" = "504b03" ] && echo zip || echo rar )"
              7z x -y -o"bios-analysis/forum/$slug" "bios-analysis/forum/$slug/archive_"* > /dev/null 2>&1
              find "bios-analysis/forum/$slug" -type f ! -name 'archive_*' -size -100k -delete
              echo "$url | $slug | $desc" >> bios-analysis/forum/SOURCES.txt
              echo "$slug: OK" >> /tmp/status.log
            else
              rm -f "/tmp/dl/$slug.bin"
            fi
          done < relay/forum_catalog.txt
          cp /tmp/status.log bios-analysis/forum/download_status.txt
          cat bios-analysis/forum/download_status.txt
          ls -laR bios-analysis/forum/ | head -60
      - name: Commit collected dumps
        run: |
          git config user.name "collect-bot" && git config user.email "bot@users.noreply.github.com"
          git add bios-analysis/forum/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "forum: collect real machine dumps [skip ci]"
          git pull --rebase -q origin arena/01a087e2-zte || true
          git push || { git pull --rebase -q origin arena/01a087e2-zte && git push; }
