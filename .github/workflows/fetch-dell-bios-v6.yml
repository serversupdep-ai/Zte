name: fetch-dell-bios-v6

# Relay v6: CatalogPC.xml -> find OptiPlex 3090 entries -> follow per-model
# catalog if needed -> download newest BIOS exe via downloads.dell.com.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v6.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Get catalog and explore
        run: |
          L=relay6_diag.txt
          : > "$L"
          exec_cmd() { echo "\$ $*" >> "$L"; "$@" >> "$L" 2>&1 || echo "(rc=$?)" >> "$L"; }
          echo "date: $(date -u)" >> "$L"
          mkdir -p cat
          curl -fsSL --retry 2 --max-time 420 -o cat/CatalogPC.cab "https://downloads.dell.com/catalog/CatalogPC.cab" >> "$L" 2>&1 || true
          sudo apt-get install -y -qq cabextract >> "$L" 2>&1 || true
          mkdir -p cat/pc
          (cd cat/pc && cabextract -q ../CatalogPC.cab) >> "$L" 2>&1 || true
          ls -la cat/pc >> "$L" 2>&1 || true
          echo "=== size of xml ===" >> "$L"; wc -c cat/pc/CatalogPC.xml >> "$L" 2>&1 || true
          echo "=== first 40 lines ===" >> "$L"; head -40 cat/pc/CatalogPC.xml >> "$L" 2>&1 || true
          echo "=== optiplex mentions ===" >> "$L"
          grep -ioE '[^<>"]*optiplex[^<>"]*' cat/pc/CatalogPC.xml | sort | uniq -c | sort -rn | head -40 >> "$L" 2>&1 || true
          echo "=== 3090 mentions ===" >> "$L"
          grep -ioE '[^<>"]*3090[^<>"]*' cat/pc/CatalogPC.xml | sort | uniq -c | sort -rn | head -40 >> "$L" 2>&1 || true
          echo "=== all urls sample ===" >> "$L"
          grep -oE 'https?://[^<"]+' cat/pc/CatalogPC.xml | sed 's#/[^/]*$##' | sort | uniq -c | sort -rn | head -30 >> "$L" 2>&1 || true
          echo "=== dell exe urls ===" >> "$L"
          grep -oE 'https?://[^<"]+\.exe' cat/pc/CatalogPC.xml | sort -u > all_exe_urls.txt || true
          wc -l all_exe_urls.txt >> "$L" 2>&1 || true
          head -30 all_exe_urls.txt >> "$L" 2>&1 || true
          cat "$L"

      - name: Follow per-model catalog or direct URL
        run: |
          L=relay6_diag.txt
          echo "=== per-model cab urls ===" >> "$L"
          grep -oE 'https?://[^<"]+\.cab' cat/pc/CatalogPC.xml | sort -u | tee all_cab_urls.txt >> "$L" 2>&1 || true
          MURL=$(grep -iE '3090|optiplex' all_cab_urls.txt | head -1 || true)
          echo "MURL=$MURL" >> "$L"
          if [ -n "$MURL" ]; then
            curl -fsSL --retry 2 --max-time 240 -o cat/model.cab "$MURL" >> "$L" 2>&1 || true
            mkdir -p cat/m
            (cd cat/m && cabextract -q ../model.cab) >> "$L" 2>&1 || true
            find cat/m -type f >> "$L" 2>&1 || true
            grep -rhoE 'https?://[^<"]+\.exe' cat/m 2>/dev/null | sort -u > model_exe_urls.txt || true
            echo "model exes:" >> "$L"; cat model_exe_urls.txt >> "$L" 2>&1 || true
          fi
          # prefer model catalog urls, fallback to master
          { [ -s model_exe_urls.txt ] && cat model_exe_urls.txt; cat all_exe_urls.txt; } | grep -iE '3090' | sort -u > bios3090_urls.txt || true
          echo "3090 urls:" >> "$L"; cat bios3090_urls.txt >> "$L" 2>&1 || true
          cat "$L"

      - name: Download newest 3090 BIOS
        run: |
          L=relay6_diag.txt
          # pick the highest version among 3090 BIOS exes; BIOS exes are named OptiPlex_3090_X.Y.Z.exe
          URL=$(grep -oE 'https?://[^ ]+/OptiPlex_3090_[0-9.]+\.exe' bios3090_urls.txt 2>/dev/null | sort -V | tail -1 || true)
          echo "URL=$URL" >> "$L" 2>&1 || true
          if [ -n "$URL" ]; then
            # dl.dell.com is 403; rewrite to downloads.dell.com which works
            DLURL=$(echo "$URL" | sed 's#https\?://dl\.dell\.com#https://downloads.dell.com#')
            echo "DLURL=$DLURL" >> "$L" 2>&1 || true
            curl -fL --retry 4 --retry-delay 3 --max-time 900 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o OptiPlex_3090_latest.exe "$DLURL" >> "$L" 2>&1 || true
            ls -la OptiPlex_3090_latest.exe >> "$L" 2>&1 || true
            sha256sum OptiPlex_3090_latest.exe > LATEST_BIOS.sha256 2>&1 || true
          fi
          cat "$L"

      - name: Always commit
        run: |
          set -e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          rm -rf cat || true
          git add -f relay6_diag.txt all_exe_urls.txt all_cab_urls.txt bios3090_urls.txt 2>/dev/null || true
          [ -f model_exe_urls.txt ] && git add -f model_exe_urls.txt || true
          [ -f OptiPlex_3090_latest.exe ] && git add -f OptiPlex_3090_latest.exe LATEST_BIOS.sha256 || true
          git status --short
          git commit -m "relay6: catalog walk + 3090 BIOS fetch [skip ci]" || echo "NOTHING TO COMMIT"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fetch-dell-bios-v6.yml || true
          git commit -m "chore: remove relay v6 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
