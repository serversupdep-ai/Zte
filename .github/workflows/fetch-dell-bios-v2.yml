name: fetch-dell-bios-v2

# Relay v2: (1) look up Dell service tag H2FS5S3 (identify machine),
# (2) fetch the latest OptiPlex 3090 BIOS (2.28.0) which should contain the
# CF1B password-family implementation. Commits everything to session branch.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Look up service tag H2FS5S3
        run: |
          set -eux
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sL -A "$UA" --retry 3 -o svc_overview.html \
            "https://www.dell.com/support/home/us/en/04/product-support/servicetag/H2FS5S3/overview" || true
          # extract model-ish strings
          grep -oE '(OptiPlex|Latitude|Inspiron|XPS|Precision|Vostro|G5? ?\d{2,4})[ -]?[0-9A-Za-z]{2,6}' svc_overview.html | sort | uniq -c | sort -rn | head -30 > svc_model.txt || true
          wc -c svc_overview.html || true

      - name: Find latest OptiPlex 3090 BIOS download URL
        run: |
          set -eux
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sL -A "$UA" --retry 3 -o drv.html \
            "https://www.dell.com/support/home/en-us/drivers/driversdetails?driverid=dgfdn&oscode=wt64a&productcode=optiplex-3090-sff" || true
          # try to find FOLDER urls in page
          grep -oE 'https://dl\.dell\.com/FOLDER[0-9]+M/[0-9]+/[^"'"'"' ]+\.exe' drv.html | sort -u > bios_urls.txt || true
          cat bios_urls.txt || true
          if [ ! -s bios_urls.txt ]; then
            # fallback: probe dell download API patterns
            echo "no urls in page; trying alternate endpoints"
            curl -sL -A "$UA" "https://www.dell.com/support/home/api/v1/drivers/driversdetails?driverid=dgfdn" -o drvapi.json || true
            grep -oE 'https://dl\.dell\.com/[^" ]+' drvapi.json | sort -u > bios_urls.txt || true
          fi
          cat bios_urls.txt || true

      - name: Download newest BIOS exe
        run: |
          set -eux
          # prefer the highest version number
          URL=$(grep -oE 'https://dl\.dell\.com/FOLDER[0-9]+M/[0-9]+/OptiPlex_3090_[0-9.]+\.exe' bios_urls.txt | sort -t_ -k3 -V | tail -1 || true)
          if [ -z "$URL" ]; then URL=$(head -1 bios_urls.txt || true); fi
          echo "URL=$URL"
          if [ -n "$URL" ]; then
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o OptiPlex_3090_latest.exe "$URL"
            ls -la OptiPlex_3090_latest.exe
            sha256sum OptiPlex_3090_latest.exe | tee LATEST_BIOS.sha256
          else
            echo "WARN: no URL found" | tee LATEST_BIOS.sha256
          fi

      - name: Commit to session branch
        run: |
          set -eux
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add svc_overview.html svc_model.txt bios_urls.txt drv.html OptiPlex_3090_latest.exe LATEST_BIOS.sha256 2>/dev/null || true
          git commit -m "relay2: service tag lookup + latest OptiPlex 3090 BIOS for CF1B analysis [skip ci]" || true
          git push origin arena/01a087e2-zte

      - name: Remove workflow (self-cleanup)
        run: |
          set -eux
          git rm -f .github/workflows/fetch-dell-bios-v2.yml || true
          git commit -m "chore: remove relay v2 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
