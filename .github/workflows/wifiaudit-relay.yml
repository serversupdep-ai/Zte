name: WiFiAudit submit (relay)

# One-off relay: this agent sandbox cannot reach api.wifiaudit.io (egress filter
# kills TLS), so the submission runs here on an open-internet runner and the
# result is printed to the log (with the API key masked and any recovered
# password redacted, because this repository is public).
#
# The key is a workflow_dispatch input, never written to a file or a commit.

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "wifiaudit.io API key (wai_...)"
        required: true
      ssid:
        description: "SSID exactly as beaconed"
        required: true
        default: "inwi Home 4G 6A6EDE"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c7bfaf99-zte

      - name: Submit to WiFiAudit and poll
        env:
          WIFIAUDIT_API_KEY: ${{ inputs.api_key }}
          SSID: ${{ inputs.ssid }}
        run: |
          set -uo pipefail
          echo "::add-mask::$WIFIAUDIT_API_KEY"

          CAP="wifi-capture/HS_inwi_Home_4G_6A6EDE10_20_31.cap"
          echo "--- capture ---"
          ls -l "$CAP"
          sha256sum "$CAP"
          [ "$(sha256sum "$CAP" | cut -d' ' -f1)" = \
            "72cc6be55e7db3b1b967af6f57e97aba420059e9fcfd101e2d82b0fc7c09ac87" ] \
            || { echo "CHECKSUM MISMATCH"; exit 1; }
          echo "ssid = '$SSID'"

          JOB=""
          echo "--- submit ---"
          for path in /api/v1/jobs /v1/jobs; do
            for field in pcap file; do
              echo "POST https://api.wifiaudit.io$path  (field=$field)"
              OUT=$(curl -sS -w '\n%{http_code}' -X POST "https://api.wifiaudit.io$path" \
                      -H "X-API-Key: $WIFIAUDIT_API_KEY" \
                      -H "Accept: application/json" \
                      -F "$field=@$CAP" \
                      -F "ssid=$SSID" 2>&1 || true)
              CODE=$(printf '%s' "$OUT" | tail -n1)
              BODY=$(printf '%s' "$OUT" | sed '$d' | sed "s|$WIFIAUDIT_API_KEY|<KEY>|g")
              echo "  HTTP $CODE"
              echo "  $BODY"
              JOB=$(printf '%s' "$BODY" | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("")
          else:
              print(d.get("job_id") or d.get("id") or "")' 2>/dev/null)
              if [ -n "$JOB" ]; then break 2; fi
              case "$CODE" in
                400|404|405|415|422) continue ;;
                *) break 2 ;;
              esac
            done
          done

          if [ -z "$JOB" ]; then
            echo "SUBMIT FAILED: no job_id returned"
            exit 1
          fi
          echo "JOB_ID=$JOB"

          echo "--- poll ---"
          B=""
          for i in $(seq 1 60); do
            B=$(curl -sS "https://api.wifiaudit.io/api/v1/jobs/$JOB" \
                  -H "X-API-Key: $WIFIAUDIT_API_KEY" 2>&1 || true)
            S=$(printf '%s' "$B" | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("")
          else:
              print((d.get("status") or "").lower())' 2>/dev/null)
            echo "  [$((i*3))s] status=$S"
            case "$S" in
              done|complete|completed|failed|error) break ;;
            esac
            sleep 3
          done

          echo "--- result (password redacted: public repo) ---"
          printf '%s' "$B" | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          print("job_id                 =", d.get("job_id", "'"$JOB"'"))
          for k in ("status", "result", "crack_duration_seconds", "passwords_tested",
                    "ssid", "network"):
              if k in d:
                  print("%-22s = %s" % (k, d[k]))
          pw = d.get("found_password") or d.get("password") or ""
          print("password_found         =", "YES (redacted)" if pw else "no")
          if pw:
              print("password_length        =", len(pw))
          ' || { echo "unparseable response:"; echo "$B"; exit 1; }
