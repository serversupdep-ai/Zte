name: Telegram login (two-stage)
# Zero-tech interactive Telegram login + immediate target download.
# The session lives only inside a single run — never printed, stored in a
# visible place, or committed (this repo is PUBLIC).
#
# USER STEPS (all in the GitHub web UI, no local software):
#   1. Run workflow: stage=phone, value=+<country><your Telegram number>
#      -> a login code appears in your Telegram app
#   2. Run workflow: stage=code, value=<that code>
#      (2FA accounts: one more run with stage=password)
#   -> target files are downloaded and committed to
#      bios-analysis/collected/raw/ automatically.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'phone | code | password'
        required: true
        default: 'phone'
      value:
        description: 'phone (+country…) | login code | 2FA password'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Setup
        run: python3 -m pip -q install pyrogram tgcrypto

      - name: Restore login state (best effort)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tglogin-state
          path: relay/

      - name: Run stage
        env:
          STAGE: ${{ github.event.inputs.stage }}
          VALUE: ${{ github.event.inputs.value }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python3 relay/tg_login.py

      - name: Save login state (stage=phone only)
        if: github.event.inputs.stage == 'phone'
        uses: actions/upload-artifact@v4
        with:
          name: tglogin-state
          path: |
            relay/tglogin_state.json
            relay/tglogin.session
          if-no-files-found: error
        continue-on-error: true

      - name: Commit downloaded files
        run: |
          git config user.name "relay-bot"
          git config user.email "relay@localhost"
          git add bios-analysis/collected/raw/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -q -m "tg-login: downloaded telegram targets [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin arena/01a087e2-zte && \
                 git push origin arena/01a087e2-zte; then ok=1; break; fi
              sleep 5
            done
            [ $ok -eq 1 ] || { echo "push failed"; exit 1; }
          fi

      - name: Cleanup old login runs (keeps one-time codes out of history)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=50" \
            --jq '.workflow_runs[] | select(.name == "Telegram login (two-stage)") | .id' 2>/dev/null | \
          while read -r id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" 2>/dev/null || true
          done || true
