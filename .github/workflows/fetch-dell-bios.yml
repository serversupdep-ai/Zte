name: fetch-dell-bios

# Temporary one-shot workflow: downloads Dell BIOS_IMG.rcv from Dell's CDN
# (dl.dell.com is unreachable from the agent sandbox) and commits it to this
# session branch so it can be pulled back and analyzed. Auto-removes itself
# after success. No secrets involved.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Download BIOS_IMG.rcv from Dell
        run: |
          set -eux
          curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o BIOS_IMG.rcv "https://dl.dell.com/FOLDER07958772M/1/BIOS_IMG.rcv"
          ls -la BIOS_IMG.rcv
          sha256sum BIOS_IMG.rcv | tee BIOS_IMG.rcv.sha256
          file BIOS_IMG.rcv || true
          xxd BIOS_IMG.rcv | head -4 || true

      - name: Commit file to session branch
        run: |
          set -eux
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add BIOS_IMG.rcv BIOS_IMG.rcv.sha256
          git commit -m "chore: fetch BIOS_IMG.rcv (FOLDER07958772M) for analysis [skip ci]"
          git push origin arena/01a087e2-zte

      - name: Remove workflow file (self-cleanup)
        run: |
          set -eux
          git rm .github/workflows/fetch-dell-bios.yml
          git commit -m "chore: remove temporary fetch workflow [skip ci]"
          git push origin arena/01a087e2-zte
