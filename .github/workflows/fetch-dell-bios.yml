name: fetch-dell-bios

# Relay workflow: downloads the Dell OptiPlex 3090 BIOS 2.0.7 files from
# dl.dell.com (unreachable from the agent sandbox) and commits them to the
# session branch so they can be pulled and analyzed. Self-removes afterwards.
# NOTE: trigger commits must NOT contain "[skip ci]" or the run is suppressed.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Download OptiPlex_3090_2.0.7.exe
        run: |
          set -eux
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o OptiPlex_3090_2.0.7.exe "https://dl.dell.com/FOLDER07958771M/2/OptiPlex_3090_2.0.7.exe"
          test "$(stat -c%s OptiPlex_3090_2.0.7.exe)" -gt 10000000

      - name: Download BIOS_IMG.rcv
        run: |
          set -eux
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o BIOS_IMG.rcv "https://dl.dell.com/FOLDER07958772M/1/BIOS_IMG.rcv"
          test "$(stat -c%s BIOS_IMG.rcv)" -gt 10000000

      - name: Record checksums
        run: |
          sha256sum OptiPlex_3090_2.0.7.exe BIOS_IMG.rcv | tee DELL_FILES.sha256

      - name: Commit Dell files to session branch
        run: |
          set -eux
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add OptiPlex_3090_2.0.7.exe BIOS_IMG.rcv DELL_FILES.sha256
          git commit -m "relay: fetch Dell OptiPlex 3090 BIOS 2.0.7 files for analysis [skip ci]"
          git push origin arena/01a087e2-zte

      - name: Remove workflow file (self-cleanup)
        run: |
          set -eux
          git rm .github/workflows/fetch-dell-bios.yml
          git commit -m "chore: remove temporary relay workflow [skip ci]"
          git push origin arena/01a087e2-zte
