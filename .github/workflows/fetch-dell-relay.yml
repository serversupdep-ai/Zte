name: Fetch Dell package relay
# Push-triggered relay: edit relay/params.env (URL/SHA256/OUT) and push this
# branch - the runner downloads the file (sandbox has no direct internet) and
# returns it as an artifact. Also manually dispatchable once registered.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['relay/params.env', '.github/workflows/fetch-dell-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Download package
        run: |
          set -x
          # relay/params.env: KEY=VALUE lines (URL, SHA256, OUT)
          source relay/params.env
          : "${URL:?URL missing in relay/params.env}"
          OUT="${OUT:-pkg.bin}"
          curl -fsSL --retry 3 --max-time 900 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "$OUT" "$URL"
          ls -la "$OUT"
          if [ -n "${SHA256:-}" ]; then
            echo "$SHA256  $OUT" | sha256sum -c - || exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dell-package
          path: pkg.bin
          retention-days: 7
        continue-on-error: true

      - name: Upload with OUT name
        uses: actions/upload-artifact@v4
        with:
          name: dell-package-named
          if-no-files-found: ignore
          path: |
            *.exe
            *.rcv
            *.bin
