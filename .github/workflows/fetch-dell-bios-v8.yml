name: fetch-dell-bios-v8

# Relay v8: THE decisive run.
#  A) Latitude 5400/5500 (CF1B generation) BIOS from CatalogPC -> extract pw modules
#  B) OptiPlex 3090 1.x-era BIOS via Wayback Machine driver-page snapshots -> extract pw modules
#  C) Service tag identification attempts (H2FS5S3)
#  Commits ONLY small artifacts (pw module .efi + dispatch report + logs).

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v8.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Setup python env
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip -q install uefi_firmware pefile capstone
          /tmp/venv/bin/python -c "import uefi_firmware, pefile, capstone; print('deps ok')"

      - name: A) Fetch CF1B-generation BIOS (Latitude 5400/5500)
        run: |
          set -x
          L=relay8_diag.txt; : > "$L"
          mkdir -p cat dl
          curl -fsSL --retry 2 --max-time 420 -o cat/CatalogPC.cab "https://downloads.dell.com/catalog/CatalogPC.cab" >> "$L" 2>&1 || true
          sudo apt-get install -y -qq cabextract >> "$L" 2>&1 || true
          mkdir -p cat/pc && (cd cat/pc && cabextract -q ../CatalogPC.cab) >> "$L" 2>&1 || true
          iconv -f UTF-16 -t UTF-8 cat/pc/CatalogPC.xml > cat/catalog.xml || true
          grep -oE 'path="FOLDER[0-9]+M/[0-9]+/[^"]*\.exe"' cat/catalog.xml | tr -d '"' | sed 's/^path=//' | sort -u > allpaths.txt || true
          grep -iE 'Latitude_(5500|5400|5300)_' allpaths.txt | sort -V > latpaths.txt || true
          grep -iE 'Precision_7740' allpaths.txt | sort -V >> latpaths.txt || true
          echo '---LAT PATHS---' | tee -a "$L"; cat latpaths.txt | tee -a "$L"
          n=0
          for rel in $(tac latpaths.txt | head -4); do
            n=$((n+1))
            u="https://downloads.dell.com/$rel"
            f="dl/target_$n.exe"
            echo "GET $u" >> "$L"
            curl -fsSL --retry 2 --max-time 600 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "$f" "$u" >> "$L" 2>&1 || { rm -f "$f"; continue; }
            ls -la "$f" >> "$L"
          done
          ls -la dl/ >> "$L" 2>&1 || true

      - name: B) Old OptiPlex 3090 BIOS via Wayback
        run: |
          set -x
          L=relay8_diag.txt
          echo "=== wayback hunt ===" >> "$L"
          for ts in 20210701 20210901 20211201 20220301; do
            api="https://archive.org/wayback/available?url=www.dell.com/support/home/en-us/drivers/driversdetails%3Fdriverid%3Ddgfdn&timestamp=$ts"
            echo "API $api" >> "$L"
            curl -fsSL --max-time 60 "$api" -o "wb_$ts.json" >> "$L" 2>&1 || true
            snap=$(python3 -c "import json,sys;d=json.load(open('wb_$ts.json'));print(d.get('archived_snapshots',{}).get('closest',{}).get('url',''))" 2>/dev/null || true)
            echo "snap=$snap" >> "$L"
            [ -n "$snap" ] && curl -fsSL --max-time 120 -A "Mozilla/5.0" "$snap" -o "wb_$ts.html" >> "$L" 2>&1 || true
            if [ -f "wb_$ts.html" ]; then
              grep -oE '(FOLDER[0-9]+M/[0-9]+/OptiPlex_3090_[0-9.]+\.exe)' "wb_$ts.html" | sort -u | tee -a wayback_paths.txt >> "$L" || true
            fi
          done
          cat wayback_paths.txt 2>/dev/null | tee -a "$L" || true
          # also try the plain driver page + version-history ajax from the live site
          curl -fsSL --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H 'Accept: text/html' "https://www.dell.com/support/home/en-us/drivers/driversdetails?driverid=dgfdn" -o drvpage.html >> "$L" 2>&1 || true
          wc -c drvpage.html >> "$L" 2>&1 || true
          grep -oE 'FOLDER[0-9]+M/[0-9]+/OptiPlex_3090_[0-9.]+\.exe' drvpage.html 2>/dev/null | sort -u | tee -a wayback_paths.txt >> "$L" || true
          # download the OLDEST 3090 version found
          oldrel=$(sort -V wayback_paths.txt 2>/dev/null | head -1 || true)
          echo "oldrel=$oldrel" >> "$L"
          if [ -n "$oldrel" ]; then
            curl -fsSL --retry 2 --max-time 600 -A "Mozilla/5.0" -o dl/target_9.exe "https://downloads.dell.com/$oldrel" >> "$L" 2>&1 || true
            ls -la dl/target_9.exe >> "$L" 2>&1 || true
          fi

      - name: C) Service tag identification
        run: |
          set -x
          L=relay8_diag.txt
          echo "=== svc tag ===" >> "$L"
          curl -sSL --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H 'Accept: text/html,application/xhtml+xml' -o svc.html \
            "https://www.dell.com/support/home/us/en/04/product-support/servicetag/H2FS5S3/overview" || true
          wc -c svc.html >> "$L" 2>&1 || true
          head -c 400 svc.html >> "$L" 2>&1 || true
          grep -ahoE '(OptiPlex|Latitude|Inspiron|XPS|Precision|Vostro|G1?[3557])[ -][0-9A-Za-z]{2,8}' svc.html 2>/dev/null | sort | uniq -c | sort -rn | head -10 | tee -a svc_model.txt >> "$L" || true
          curl -sSL --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o bing.html "https://www.bing.com/search?q=%22H2FS5S3%22" || true
          grep -oE '<h2>.*?</h2>' bing.html 2>/dev/null | head -20 >> "$L" || true
          wc -c bing.html >> "$L" 2>&1 || true

      - name: Extract password modules from all downloaded BIOS
        run: |
          L=relay8_diag.txt
          echo "=== EXTRACTION ===" >> "$L"
          ls -la dl/ >> "$L" 2>&1 || true
          /tmp/venv/bin/python bios-analysis/extract_pw_modules.py "dl/target_*.exe" >> "$L" 2>&1 || true
          mv pw_mods pwmods 2>/dev/null || true
          ls -la pwmods/ >> "$L" 2>&1 || true
          cat "$L"

      - name: Always commit
        run: |
          set -e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          rm -rf cat dl wb_*.html wb_*.json drvpage.html bing.html /tmp/*_dub.bin /tmp/*_bios.bin 2>/dev/null || true
          git add -f relay8_diag.txt allpaths.txt latpaths.txt wayback_paths.txt svc.html svc_model.txt pwmods 2>/dev/null || true
          git status --short
          git commit -m "relay8: CF1B-generation pw modules + wayback 3090 hunt + svc tag lookup [skip ci]" || echo "NOTHING TO COMMIT"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fetch-dell-bios-v8.yml || true
          git commit -m "chore: remove relay v8 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
