name: Analyze forum dumps
# Runs analyze_forum_dumps.py over ALL collected forum archives (7z unpack,
# needs p7zip-rar) and commits the analysis (new EC/pw binaries + info.json
# + summary). Only new material is committed; corpus-identical payloads are
# recorded by sha256. Follows the opensources collectors' race-safe pattern.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['bios-analysis/analyze_forum_dumps.py', '.github/workflows/analyze-forum-dumps.yml']
  workflow_dispatch:

concurrency:
  group: analyze-forum-dumps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Setup
        run: |
          python3 -m pip -q install uefi_firmware pefile
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends p7zip-full p7zip-rar > /dev/null

      - name: Analyze all forum dumps (incl. archive unpack)
        run: |
          set -x
          python3 bios-analysis/analyze_forum_dumps.py --unpack-archives 2>&1 | tee forum-analysis.log
          du -sh bios-analysis/forum/analysis || true

      - name: EC record-store census (password records) across all dumps
        run: |
          set -x
          mkdir -p /tmp/storecensus
          : > bios-analysis/forum/analysis/store-census.txt
          find /tmp -name '*.BIN' -o -name '*.bin' 2>/dev/null | true
          # dumps/ dir first
          for f in bios-analysis/forum/opensources/dumps/*; do
            [ -f "$f" ] || continue
            echo "### $f" >> bios-analysis/forum/analysis/store-census.txt
            python3 bios-analysis/rex98_patcher.py --store "$f" >> bios-analysis/forum/analysis/store-census.txt 2>&1 || true
          done
          # archives (7z to temp)
          for a in bios-analysis/forum/opensources/archives/*; do
            case "$a" in *.zip) 7z x -y -o/tmp/storecensus/$(basename "$a" .zip) -pindiafix "$a" >/dev/null 2>&1 || 7z x -y -o/tmp/storecensus/$(basename "$a" .zip) -p "$a" >/dev/null 2>&1;; esac
            case "$a" in *.rar) 7z x -y -o/tmp/storecensus/$(basename "$a" .rar) -pindiafix "$a" >/dev/null 2>&1 || 7z x -y -o/tmp/storecensus/$(basename "$a" .rar) -p "$a" >/dev/null 2>&1;; esac
          done
          find /tmp/storecensus -type f \( -iname '*.bin' -o -iname '*.BIN' \) -size +2M | while read f; do
            echo "### $f" >> bios-analysis/forum/analysis/store-census.txt
            python3 bios-analysis/rex98_patcher.py --store "$f" >> bios-analysis/forum/analysis/store-census.txt 2>&1 || true
          done
          grep -c 'PASSWORD RECORD' bios-analysis/forum/analysis/store-census.txt || true

      - name: Commit analysis
        run: |
          git config user.name "relay-bot"
          git config user.email "relay@localhost"
          git pull --rebase origin arena/01a087e2-zte || true
          git add bios-analysis/forum/analysis/ forum-analysis.log || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -q -m "analyze: forum dump analysis over all archives [skip ci]"
            git push origin arena/01a087e2-zte || {
              git pull --rebase origin arena/01a087e2-zte && git push origin arena/01a087e2-zte
            }
          fi

      - name: Upload log (best effort)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-analysis-log
          path: forum-analysis.log
          if-no-files-found: ignore
        continue-on-error: true
