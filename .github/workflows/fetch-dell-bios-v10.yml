name: fetch-dell-bios-v10

# Relay v10: Latitude_5X00 (CF1B generation) BIOS -> extract pw modules + commit exe.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v10.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Setup python env
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip -q install uefi_firmware pefile capstone

      - name: Download CF1B-generation BIOS packages
        run: |
          set -x
          L=relay10_diag.txt; : > "$L"
          mkdir -p dl
          get() {
            rel="$1"; out="$2"
            echo "GET https://downloads.dell.com/$rel" >> "$L"
            curl -fsSL --retry 3 --max-time 900 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "$out" "https://downloads.dell.com/$rel" >> "$L" 2>&1 || { rm -f "$out"; return 1; }
            ls -la "$out" >> "$L"
          }
          get "FOLDER13970198M/1/Latitude_5X00_Precision_3540_1.43.1.exe" "dl/Latitude_5X00.exe" || true
          get "FOLDER13498661M/1/Latitude_5300_1.37.0.exe" "dl/Latitude_5300.exe" || true
          get "FOLDER12975937M/1/Latitude_5X90_1.41.0.exe" "dl/Latitude_5X90.exe" || true
          ls -la dl/ >> "$L" 2>&1 || true
          sha256sum dl/*.exe >> "$L" 2>&1 || true

      - name: Extract password modules
        run: |
          L=relay10_diag.txt
          echo "=== EXTRACTION ===" >> "$L"
          /tmp/venv/bin/python bios-analysis/extract_pw_modules.py "dl/*.exe" >> "$L" 2>&1 || true
          mv pw_mods pwmods 2>/dev/null || true
          ls -la pwmods/ >> "$L" 2>&1 || true
          cat "$L"

      - name: Always commit (per-file)
        run: |
          set -x
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          for f in relay10_diag.txt; do [ -e "$f" ] && git add -f "$f"; done
          [ -d pwmods ] && git add -f pwmods
          # keep the BIOS exes too (needed for deeper analysis later)
          for f in dl/*.exe; do [ -e "$f" ] && git add -f "$f"; done
          git status --short
          git commit -m "relay10: Latitude 5X00 (CF1B gen) BIOS + pw modules [skip ci]" || echo "NOTHING TO COMMIT"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fetch-dell-bios-v10.yml || true
          git commit -m "chore: remove relay v10 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
