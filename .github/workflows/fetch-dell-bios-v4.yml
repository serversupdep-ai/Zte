name: fetch-dell-bios-v4

# Relay v4: heavily-logged attempt to obtain the latest OptiPlex 3090 BIOS.
# Always commits relay_log.txt so failures are diagnosable from the sandbox.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Discover and download
        shell: bash
        run: |
          exec > >(tee -a relay_log.txt) 2>&1
          set -x
          date
          echo "=== A: probe catalogs ==="
          mkdir -p cat
          for u in \
            "https://dl.dell.com/catalog/OptiPlex_3090.cab" \
            "https://downloads.dell.com/catalog/OptiPlex_3090.cab" \
            "https://downloads.dell.com/catalog/OptiPlex_3090_SFF.cab" \
            "https://downloads.dell.com/catalog/OptiPlex%203090%20SFF.cab" ; do
            n=$(echo "$u" | md5sum | cut -c1-8)
            code=$(curl -sL --retry 1 --max-time 120 -w '%{http_code}' -o "cat/$n.cab" "$u" || echo ERR)
            echo "$u -> $code size=$(stat -c%s cat/$n.cab 2>/dev/null || echo 0)"
            if [ "$code" != "200" ]; then rm -f "cat/$n.cab"; fi
          done
          echo "=== B: master client catalog ==="
          code=$(curl -sL --retry 2 --max-time 600 -w '%{http_code}' -o cat/CatalogPC.cab "https://downloads.dell.com/catalog/CatalogPC.cab" || echo ERR)
          echo "CatalogPC.cab -> $code size=$(stat -c%s cat/CatalogPC.cab 2>/dev/null || echo 0)"
          [ "$code" = "200" ] || code2=$(curl -sL --retry 2 --max-time 600 -w '%{http_code}' -o cat/CatalogPC.cab "https://dl.dell.com/catalog/CatalogPC.cab" || echo ERR)
          echo "CatalogPC via dl -> $code2 size=$(stat -c%s cat/CatalogPC.cab 2>/dev/null || echo 0)"
          echo "=== C: extract catalogs ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq cabextract >/dev/null 2>&1 || true
          which cabextract 7z || true
          for f in cat/*.cab; do
            [ -s "$f" ] || continue
            d="cat/x_$(basename "$f" .cab)"; mkdir -p "$d"
            cabextract -q -d "$d" "$f" 2>&1 | head -3 || (cd "$d" && 7z x -y "../$(basename "$f")" 2>&1 | head -3) || true
          done
          find cat -type f -exec ls -la {} \; 2>/dev/null | head -40
          echo "=== D: harvest URLs ==="
          grep -rhoE 'https?://(downloads|dl)\.dell\.com/[^<" ]*3090[^<" ]*\.exe' cat/ 2>/dev/null | sort -u | tee bios_urls.txt || true
          wc -l bios_urls.txt || true
          echo "=== E: bing fallback ==="
          if [ ! -s bios_urls.txt ]; then
            for q in "OptiPlex_3090_2.28.0.exe" "OptiPlex 3090 BIOS 2.28.0 dl.dell.com FOLDER" "OptiPlex_3090_2.27.0.exe"; do
              curl -sL --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
                "https://www.bing.com/search?q=%22$(echo "$q" | sed 's/ /%20/g')%22" -o "bing_$RANDOM.html" || true
            done
            grep -rhoE 'https?://dl\.dell\.com/FOLDER[0-9]+M/[0-9]+/[^"&< ]*\.exe' bing_*.html 2>/dev/null | sort -u | tee -a bios_urls.txt || true
          fi
          cat bios_urls.txt || true
          echo "=== F: download newest ==="
          URL=$(grep -oE 'https?://[^ ]*3090[^ ]*\.exe' bios_urls.txt 2>/dev/null | sort -V | tail -1 || true)
          echo "URL=$URL" | tee url_used.txt
          if [ -n "$URL" ]; then
            curl -fL --retry 4 --retry-delay 3 -o OptiPlex_3090_latest.exe "$URL"
            ls -la OptiPlex_3090_latest.exe
            sha256sum OptiPlex_3090_latest.exe | tee LATEST_BIOS.sha256
          fi
          echo "=== G: svc tag best effort ==="
          curl -sL --max-time 40 -A "Mozilla/5.0" "https://www.dell.com/support/home/us/en/04/product-support/servicetag/H2FS5S3/overview" -o svc.html || true
          wc -c svc.html || true
          grep -ahoE '(OptiPlex|Latitude|Inspiron|XPS|Precision|Vostro)[ -][0-9A-Za-z]{2,8}' svc.html 2>/dev/null | sort | uniq -c | sort -rn | head -10 | tee svc_model.txt || true
          date
          echo DONE

      - name: Always commit
        run: |
          set -x
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          rm -rf cat bing_*.html 2>/dev/null || true
          git add relay_log.txt bios_urls.txt url_used.txt svc_model.txt svc.html OptiPlex_3090_latest.exe LATEST_BIOS.sha256 2>/dev/null || true
          git commit -m "relay4: diagnostics + latest 3090 BIOS attempt [skip ci]" || echo "nothing to commit"
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          set -x
          git rm -f .github/workflows/fetch-dell-bios-v4.yml || true
          git commit -m "chore: remove relay v4 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
