name: fetch-dell-bios-v3

# Relay v3: discover the latest OptiPlex 3090 BIOS URL via Dell's enterprise
# update catalogs (downloads.dell.com CAB), download it, and commit. Also
# retry service-tag identification for H2FS5S3.

on:
  push:
    branches: [arena/01a087e2-zte]
    paths: ['.github/workflows/fetch-dell-bios-v3.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a087e2-zte

      - name: Discover BIOS URLs from Dell catalogs
        shell: bash
        run: |
          set -x
          mkdir -p cat
          # probe per-model catalog names then the big client catalog
          for u in \
            "https://downloads.dell.com/catalog/OptiPlex_3090.cab" \
            "https://downloads.dell.com/catalog/OptiPlex_3090_SFF.cab" \
            "https://downloads.dell.com/catalog/OptiPlex%203090%20SFF.cab" \
            "https://downloads.dell.com/catalog/OptiPlex-3090-System-Brand.cab" ; do
            n=$(echo "$u" | sed 's#.*/##; s/%20/_/g')
            if curl -fsSL --retry 2 -o "cat/$n" "$u"; then echo "GOT $u"; fi
          done
          ls -la cat/ || true
          # extract any catalog contents (cab -> lcab? try cabextract, 7z, binwalk-less)
          sudo apt-get install -y cabextract >/dev/null 2>&1 || true
          for f in cat/*.cab; do
            [ -f "$f" ] || continue
            d="cat/$(basename "$f" .cab)_x"; mkdir -p "$d"
            cabextract -q -d "$d" "$f" 2>/dev/null || (cd "$d" && 7z x -y "../$(basename $f)" >/dev/null 2>&1) || true
          done
          find cat -type f | head -20
          # pull all dell download URLs mentioning OptiPlex 3090 BIOS exes
          grep -rhoE 'https?://downloads\.dell\.com/[^<" ]*OptiPlex[_%]?3090[^<" ]*\.exe' cat/ 2>/dev/null | sort -u > bios_urls.txt || true
          # if nothing per-model, try the master client catalog (bigger)
          if [ ! -s bios_urls.txt ]; then
            curl -fsSL --retry 2 -o cat/CatalogPC.cab "https://downloads.dell.com/catalog/CatalogPC.cab" || true
            mkdir -p cat/pc && (cd cat/pc && cabextract -q ../CatalogPC.cab 2>/dev/null || 7z x -y ../CatalogPC.cab >/dev/null 2>&1) || true
            grep -rhoE 'https?://downloads\.dell\.com/[^<" ]*OptiPlex[_%]?3090[^<" ]*\.exe' cat/pc 2>/dev/null | sort -u > bios_urls.txt || true
          fi
          echo '---URLS---'; cat bios_urls.txt || true

      - name: Service tag lookup (best effort)
        run: |
          set -x
          for tag in H2FS5S3 h2fs5s3; do
            curl -sL --retry 2 --max-time 40 \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml' \
              "https://www.dell.com/support/home/us/en/04/product-support/servicetag/$tag/overview" -o "svc_$tag.html" || true
          done
          grep -ahoE '(OptiPlex|Latitude|Inspiron|XPS|Precision|Vostro|Chromebook)[ -][0-9A-Za-z]{2,8}' svc_*.html 2>/dev/null | sort | uniq -c | sort -rn | head -20 > svc_model.txt || true
          echo '---MODEL---'; cat svc_model.txt || true

      - name: Download newest BIOS
        run: |
          set -x
          URL=$(grep -oE 'https?://[^ ]*OptiPlex[_%]?3090[^ ]*\.exe' bios_urls.txt 2>/dev/null | sort -V | tail -1 || true)
          echo "URL=$URL" | tee url_used.txt
          if [ -n "$URL" ]; then
            curl -fL --retry 4 --retry-delay 3 -o OptiPlex_3090_latest.exe "$URL"
            ls -la OptiPlex_3090_latest.exe
            sha256sum OptiPlex_3090_latest.exe | tee LATEST_BIOS.sha256
          fi

      - name: Commit artifacts
        run: |
          set -x
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add bios_urls.txt url_used.txt svc_*.html svc_model.txt OptiPlex_3090_latest.exe LATEST_BIOS.sha256 cat 2>/dev/null || true
          # do not commit the huge catalog binaries; keep only if small
          git reset -q -- cat 2>/dev/null || true
          git commit -m "relay3: latest OptiPlex 3090 BIOS via Dell catalog + svc tag lookup [skip ci]" || true
          git push origin arena/01a087e2-zte

      - name: Self-cleanup
        run: |
          set -x
          git rm -f .github/workflows/fetch-dell-bios-v3.yml || true
          git commit -m "chore: remove relay v3 workflow [skip ci]" || true
          git push origin arena/01a087e2-zte
